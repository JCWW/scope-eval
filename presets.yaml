# Preset telescopes, cameras, and mounts offered by scope-eval's menus.
#
# Values come from vendor and dealer listings as noted in each `source`
# field. Always confirm against the current spec sheet before a purchase.
#
# obstruction: one of `!by_diameter <fraction>`, `!by_area <fraction>`, or `none`.
# shutter: one of `!rolling { line_time_us: <float or null> }` or `global`.
# mount_type: one of `alt_az`, `equatorial`, `unknown`.
# non_sidereal_tracking: `true`, `false`, or omit/null if not known.
# throughput: optical throughput 0..1, or omit/null if not measured.
# qe: peak quantum efficiency 0..1, or omit/null if not entered.
# max_accel_deg_s2, settle_time_s: mount dynamics, or omit/null if not published.

telescopes:
  - name: "PlaneWave DeltaRho 350 (14\" f/3)"
    aperture_mm: 350.0
    focal_length_mm: 1050.0
    obstruction: !by_diameter 0.56
    image_circle_mm: 60.0
    back_focus_mm: 143.5
    weight_lb: 46.0
    throughput: null
    spot:
      convention: unknown
      points:
        - field_radius_mm: 0.0
          rms_um: 4.9
        - field_radius_mm: 23.0
          rms_um: 6.2
        - field_radius_mm: 30.0
          rms_um: 7.6
    source: "PlaneWave/dealer spec sheets. Back focus is from the mounting surface without focuser. Some listings quote 5.6/6.4 um off-axis instead of 6.2/7.6 um. The conservative values are used here."

  - name: "PlaneWave DeltaRho 500 (20\" f/3)"
