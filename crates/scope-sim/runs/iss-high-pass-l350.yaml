# The ISS's highest pass in a three-day window over a site at 35 N, 100 W,
# tracked by a DeltaRho 350 + IMX455 on a PlaneWave L-350. The pass peaks
# at 83 deg, close enough to the zenith to work the azimuth axis hard.
#
#   cargo run -p scope-sim -- run crates/scope-sim/runs/iss-high-pass-l350.yaml --format summary

config:
  name: DeltaRho 350 + IMX455 on L-350
  telescope: PlaneWave DeltaRho 350 (14" f/3)
  camera: Sony IMX455 full frame (Moravian C3-61000 PRO, QHY600 PRO)
  mount: PlaneWave L-350 (direct drive)
  mount_overrides:
    pointing_rms_arcsec: 30

scenario:
  site: { lat_deg: 35.0, lon_deg: -100.0, alt_m: 100.0 }
  target:
    kind: tle
    text: |
      ISS (ZARYA)
      1 25544U 98067A   08264.51782528 -.00002182  00000-0 -11606-4 0  2927
      2 25544  51.6416 247.4627 0006703 130.5360 325.0288 15.72125391563537
  start: "2008-09-20T12:00:00Z"
  hours: 72
  min_el_deg: 10
  ephemeris_error_km: 1.0
  seed: 7

pass: highest
