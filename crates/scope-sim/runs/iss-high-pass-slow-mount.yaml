# The same pass and tube on a slow alt-az mount whose two axes differ:
# azimuth 2 deg/s and 1 deg/s^2, elevation held to 1 deg/s and 0.5 deg/s^2.
# The azimuth swing near the zenith is more than the mount can follow, so
# the target leaves the field.

config:
  name: DeltaRho 350 + IMX455 on a slow alt-az mount
  telescope: PlaneWave DeltaRho 350 (14" f/3)
  camera: Sony IMX455 full frame (Moravian C3-61000 PRO, QHY600 PRO)
  mount: PlaneWave L-350 (direct drive)
  mount_overrides:
    max_rate_deg_s: 2
    max_accel_deg_s2: 1
    max_rate_deg_s_by_axis: [null, 1]
    max_accel_deg_s2_by_axis: [null, 0.5]
    pointing_rms_arcsec: 30
    jitter_rms_arcsec: 2

scenario:
  site: { lat_deg: 35.0, lon_deg: -100.0, alt_m: 100.0 }
  target:
    kind: tle
    text: |
      ISS (ZARYA)
      1 25544U 98067A   08264.51782528 -.00002182  00000-0 -11606-4 0  2927
      2 25544  51.6416 247.4627 0006703 130.5360 325.0288 15.72125391563537
  start: "2008-09-20T12:00:00Z"
  hours: 72
  min_el_deg: 10
  ephemeris_error_km: 0.5
  seed: 11

pass: highest
