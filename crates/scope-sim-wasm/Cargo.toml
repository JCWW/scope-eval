[package]
name = "scope-sim-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "WebAssembly bindings for scope-sim, used by the dashboard"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scope-sim = { path = "../scope-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
