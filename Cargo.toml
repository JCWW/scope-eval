[package]
name = "scope-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Interactive calculator that evaluates a telescope + camera pairing against eight optical checks"
license = "MIT"

[dependencies]
orbit-prop = { path = "crates/orbit-prop" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[workspace]
members = [".", "crates/orbit-prop"]
default-members = [".", "crates/orbit-prop"]

[profile.release]
opt-level = 3
